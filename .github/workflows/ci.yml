name: CI

# Tests on every push and PR to main; a green main also deploys to the VPS.
# The browser suite (e2e/qa.mjs) is NOT here: it drives a real Chrome against a
# seeded stack and takes minutes. Run it by hand with `make e2e`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go tests
    runs-on: ubuntu-latest
    services:
      postgres:
        # POSTGRES_USER becomes this cluster's superuser, so it may CREATE
        # DATABASE — which the test helpers do for every suite.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opsflow
          POSTGRES_PASSWORD: opsflow
          POSTGRES_DB: opsflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U opsflow"
          --health-interval 5s --health-timeout 5s --health-retries 15
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://opsflow:opsflow@localhost:5432/postgres?sslmode=disable
      TEST_REDIS_URL: redis://localhost:6379/0
      TEST_S3_BUCKET: opsflow-test
      S3_ENDPOINT: localhost:9000
      S3_ACCESS_KEY: opsflow
      S3_SECRET_KEY: opsflow-secret
      S3_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # MinIO cannot be a `services:` entry: service containers take no command
      # arguments and this image needs `server /data`.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=opsflow \
            -e MINIO_ROOT_PASSWORD=opsflow-secret \
            ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z server /data
          for _ in $(seq 1 40); do
            if curl -sf http://localhost:9000/minio/health/live >/dev/null; then
              echo "minio up"; exit 0
            fi
            sleep 2
          done
          echo "minio never came up"; docker logs minio; exit 1

      # The test helpers call t.Skip() when TEST_* is unset, which would make a
      # misconfigured job pass having tested nothing. Prove the services are
      # actually reachable first.
      - name: Preflight — services must really be up
        # The runner has no Postgres or Redis client, so the checks run from the
        # service images themselves (already pulled for the services).
        run: |
          docker run --rm --network host postgres:16-alpine pg_isready -h localhost -p 5432 -U opsflow
          docker run --rm --network host redis:7-alpine redis-cli -h localhost -p 6379 ping
          curl -sf http://localhost:9000/minio/health/live >/dev/null && echo "minio ok"

      - name: go vet
        working-directory: backend
        run: go vet ./...

      - name: go test
        working-directory: backend
        run: go test ./... -count=1

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # PageProps / LayoutProps are generated by Next; tsc alone can't see them.
      - name: Typecheck
        working-directory: frontend
        run: npx next typegen && npx tsc --noEmit

      - name: Build
        working-directory: frontend
        # Rewrites are resolved at build time; the API need not be reachable.
        run: npm run build

  deploy:
    name: Deploy to VPS
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Never let two deploys overlap, and never cancel one half-way.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        run: |
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}"  > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          # Pinned host key: CI refuses to deploy to anything but this server.
          printf '%s\n' "${{ secrets.VPS_HOST_KEY }}" > "$HOME/.ssh/known_hosts"
          # The argument is ignored — the key is locked to a forced command that
          # pulls origin/main and runs deploy/02-deploy.sh.
          ssh -i "$HOME/.ssh/id_ed25519" \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" deploy
